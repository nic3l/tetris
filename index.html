<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Разработка идёт правкой этого файла: пусть браузер всегда берёт свежую версию,
     а не показывает старую из кэша по обычному F5. -->
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>Тетрис 10×15</title>
<style>
  :root {
    --cell: 56px;
    --bg: #10131a;
    --grid: #1b2030;
    --line: #262d42;
    --text: #e8ecf5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #stage {
    display: flex;
    align-items: flex-start;
    gap: 24px;
    transition: filter .25s ease;
  }
  #stage.over { filter: blur(6px); }
  canvas {
    background: var(--grid);
    border: 2px solid var(--line);
    border-radius: 8px;
    display: block;
  }
  #panel { min-width: 120px; padding-top: 4px; }
  #panel .label {
    font-size: 12px;
    letter-spacing: .14em;
    text-transform: uppercase;
    opacity: .55;
  }
  #score { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .best-label { margin-top: 16px; }
  #best { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; opacity: .7; }
  #help { margin-top: 24px; font-size: 13px; line-height: 1.7; opacity: .5; }
  #help b { color: var(--text); font-weight: 600; }

  #overlay {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    text-align: center;
  }
  #overlay.show { display: flex; }
  #overlay h1 { margin: 0; font-size: 28px; font-weight: 600; opacity: .8; }
  #finalScore { font-size: 72px; font-weight: 700; line-height: 1; }
  #finalBest { font-size: 18px; opacity: .65; }
  #finalBest.record { opacity: 1; color: #f2c14e; font-weight: 600; }
  #restart {
    margin-top: 8px;
    padding: 12px 28px;
    font: inherit;
    font-weight: 600;
    color: #10131a;
    background: var(--text);
    border: 0;
    border-radius: 999px;
    cursor: pointer;
  }
  #restart:hover { opacity: .85; }
</style>
</head>
<body>

<div id="stage">
  <canvas id="board"></canvas>
  <div id="panel">
    <div class="label">Счёт</div>
    <div id="score">0</div>
    <div class="label best-label">Рекорд</div>
    <div id="best">0</div>
    <div id="help">
      <b>A</b> <b>←</b> — влево<br>
      <b>D</b> <b>→</b> — вправо<br>
      <b>S</b> — ускорить<br>
      <b>W</b> <b>↑</b> — поворот<br>
      <b>X</b> <b>↓</b> — переместить вниз
    </div>
  </div>
</div>

<div id="overlay">
  <h1>Игра окончена</h1>
  <div id="finalScore">0</div>
  <div id="finalBest">Рекорд 0</div>
  <button id="restart">Начать заново</button>
</div>

<script>
const COLS = 10;
const ROWS = 15;
const CELL = 40;
const DROP_MS = 1000;      // стартовая скорость: 1 клетка в секунду
const FAST_FACTOR = 5;     // ускорение на S/Ы
const SPEED_STEP = 30;     // каждые 30 очков...
const SPEED_MULT = 1.25;   // ...скорость падения умножается на 1.25
const MIN_DROP_MS = 250;   // предел разгона: не быстрее 250 мс на клетку
const LOCK_DIM = 0.55;     // насколько гаснет блок, когда фигура застыла
const TELEPORT_MS = 130;   // перелёт фигуры вниз по X/Ч и стрелке вниз
const SHRINK_MS = 170;     // собранная строка сжимается
const FALL_MS = 130;       // ...и всё, что над ней, съезжает вниз

// Фигуры: матрица 1/0 + цвет.
const SHAPES = [
  { name: 'dot',   color: '#f2c14e', cells: [[1]] },
  { name: 'i3',    color: '#4ec9f2', cells: [[1],[1],[1]] },
  { name: 'i4',    color: '#4e8cf2', cells: [[1],[1],[1],[1]] },
  { name: 'i5',    color: '#7a6cf5', cells: [[1],[1],[1],[1],[1]] },
  { name: 'o4',    color: '#f27a4e', cells: [[1,1],[1,1]] },
  { name: 'o9',    color: '#ef5b7b', cells: [[1,1,1],[1,1,1],[1,1,1]] },
  { name: 'rect',  color: '#5ad19a', cells: [[1,1],[1,1],[1,1]] },
  // Г-образная: высота 4, сверху один блок влево
  { name: 'jTall', color: '#c46ef0', cells: [[1,1],[0,1],[0,1],[0,1]] },
];

const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
canvas.width = COLS * CELL;
canvas.height = ROWS * CELL;

const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const finalScoreEl = document.getElementById('finalScore');
const finalBestEl = document.getElementById('finalBest');
const overlayEl = document.getElementById('overlay');
const stageEl = document.getElementById('stage');

let grid, piece, score, gameOver, softDrop, dropAcc, lastTs, rafId;

// Рекорд переживает перезагрузку страницы. localStorage может быть недоступен
// (приватный режим, ограничения песочницы) — тогда рекорд живёт до закрытия вкладки.
const BEST_KEY = 'tetris-best';
let best = 0;
try { best = parseInt(localStorage.getItem(BEST_KEY), 10) || 0; } catch (e) {}

function saveBest() {
  try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
}

const slamKeys = new Set();   // зажатые клавиши телепорта: до отпускания не повторяем
// Анимация очистки строк: null либо {phase:'shrink'|'fall', t, rows|shifts}.
// Пока она идёт, игра стоит: фигура не падает и новая не появляется.
let anim = null;

function emptyGrid() {
  return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
}

function rotateCW(cells) {
  const h = cells.length, w = cells[0].length;
  const out = Array.from({ length: w }, () => Array(h).fill(0));
  for (let y = 0; y < h; y++)
    for (let x = 0; x < w; x++)
      out[x][h - 1 - y] = cells[y][x];
  return out;
}

function spawn() {
  const shape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
  const cells = shape.cells.map(row => row.slice());
  const w = cells[0].length;
  const p = {
    cells,
    color: shape.color,
    x: Math.floor((COLS - w) / 2),   // по центру сверху
    y: 0,
    rot: 0,                          // номер поворота, 0..3
  };
  if (collides(p, 0, 0)) { endGame(); return; }
  piece = p;
  dropAcc = 0;      // новая фигура начинает клетку с нуля, без визуального рывка
  softDrop = false; // ускорение сбрасывается: нужно отпустить S/Ы и нажать заново,
                    // иначе свежая фигура улетала бы вниз до того, как её заметишь
}

function collides(p, dx, dy, cells = p.cells) {
  for (let y = 0; y < cells.length; y++) {
    for (let x = 0; x < cells[y].length; x++) {
      if (!cells[y][x]) continue;
      const nx = p.x + x + dx;
      const ny = p.y + y + dy;
      if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
      if (ny >= 0 && grid[ny][nx]) return true;
    }
  }
  return false;
}

function move(dx) {
  if (!piece || gameOver) return;
  if (!collides(piece, dx, 0)) piece.x += dx;
}

function rotate() {
  if (!piece || gameOver) return;
  const rotated = rotateCW(piece.cells);
  const w = piece.cells[0].length, h = piece.cells.length;
  // Поворот вокруг центра. Координата фигуры — её левый верхний угол,
  // а рамка при повороте меняет ширину с высотой (w×h → h×w). Без поправки
  // угол остаётся на месте и фигура будто крутится вокруг него; сдвигаем
  // так, чтобы совпали центры старой и новой рамки.
  // У фигур вроде 2×3 центр приходится на полклетки, и округление всегда
  // в одну сторону уводило бы фигуру всё дальше при каждом повороте.
  // Чередуем округление по чётности поворота — тогда пара поворотов
  // возвращает фигуру ровно туда, где она была.
  const round = piece.rot % 2 === 0 ? Math.floor : Math.ceil;
  const cx = round((w - h) / 2);
  const cy = round((h - w) / 2);
  // wall-kick: если на новом месте не помещается — пробуем рядом
  for (const dy of [0, 1, 2, -1, -2]) {
    for (const dx of [0, -1, 1, -2, 2]) {
      const probe = { x: piece.x + cx + dx, y: piece.y + cy + dy, cells: rotated };
      if (probe.y < 0) continue;   // выше поля фигуру не поднимаем
      if (!collides(probe, 0, 0, rotated)) {
        piece.cells = rotated;
        piece.x = probe.x;
        piece.y = probe.y;
        piece.rot = (piece.rot + 1) % 4;
        return;
      }
    }
  }
}

// X/Ч и стрелка вниз: фигура исчезает на месте и появляется внизу.
// Промежуточных положений нет — только короткий перелёт «растаяла → проявилась».
function hardDrop() {
  if (!piece || gameOver || anim) return;
  const fromY = piece.y;
  while (!collides(piece, 0, 1)) piece.y++;
  dropAcc = 0;
  if (piece.y === fromY) { lock(); return; }   // уже на дне, показывать нечего
  anim = { phase: 'teleport', t: 0, piece, fromY, toY: piece.y };
  piece = null;   // на время перелёта фигурой не управляют
}

function lock() {
  for (let y = 0; y < piece.cells.length; y++) {
    for (let x = 0; x < piece.cells[y].length; x++) {
      if (!piece.cells[y][x]) continue;
      const gy = piece.y + y, gx = piece.x + x;
      if (gy >= 0) grid[gy][gx] = piece.color;
    }
  }
  piece = null;

  const rows = fullRows();
  if (rows.length) {
    // Есть что убирать — запускаем анимацию. Следующая фигура появится
    // после неё, из finishAnim().
    anim = { phase: 'shrink', t: 0, rows };
    return;
  }
  if (checkTopOut()) { endGame(); return; }
  spawn();
}

function fullRows() {
  const rows = [];
  for (let y = 0; y < ROWS; y++) if (grid[y].every(c => c)) rows.push(y);
  return rows;
}

// Убирает строки и запоминает, на сколько клеток съехала каждая
// уцелевшая строка — это нужно, чтобы нарисовать съезд.
function applyClear(rows) {
  const cleared = new Set(rows);
  const kept = [];
  const shifts = [];
  for (let y = 0; y < ROWS; y++) {
    if (cleared.has(y)) continue;
    // строка падает на столько клеток, сколько убрано под ней
    let shift = 0;
    for (const c of rows) if (c > y) shift++;
    kept.push(grid[y]);
    shifts.push(shift);
  }
  while (kept.length < ROWS) { kept.unshift(Array(COLS).fill(null)); shifts.unshift(0); }
  grid = kept;
  score += 10 * rows.length;
  scoreEl.textContent = score;
  // Рекорд обновляется прямо по ходу игры, как только счёт его перегнал.
  if (score > best) { best = score; bestEl.textContent = best; saveBest(); }
  return shifts;
}

// Конец игры: какая-то колонка заполнена на всю высоту поля (ROWS).
function checkTopOut() {
  for (let x = 0; x < COLS; x++) {
    let full = true;
    for (let y = 0; y < ROWS; y++) if (!grid[y][x]) { full = false; break; }
    if (full) return true;
  }
  return false;
}

function step() {
  if (!piece) return;
  if (!collides(piece, 0, 1)) piece.y += 1;
  else lock();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // сетка
  ctx.strokeStyle = 'rgba(255,255,255,.05)';
  ctx.lineWidth = 1;
  for (let i = 1; i < COLS; i++) {
    ctx.beginPath(); ctx.moveTo(i * CELL + .5, 0); ctx.lineTo(i * CELL + .5, canvas.height); ctx.stroke();
  }
  for (let i = 1; i < ROWS; i++) {
    ctx.beginPath(); ctx.moveTo(0, i * CELL + .5); ctx.lineTo(canvas.width, i * CELL + .5); ctx.stroke();
  }

  // Застывшие блоки — приглушённые, активная фигура — яркая.
  // Во время очистки: собранные строки сжимаются, потом уцелевшие съезжают вниз.
  const shrinking = anim && anim.phase === 'shrink';
  const falling = anim && anim.phase === 'fall';
  const p = anim ? Math.min(1, anim.t / (shrinking ? SHRINK_MS : FALL_MS)) : 0;

  for (let y = 0; y < ROWS; y++) {
    const scale = shrinking && anim.rows.includes(y) ? 1 - p : 1;
    // строка едет снизу вверх к своему новому месту: стартует выше на shift клеток
    const offset = falling ? -anim.shifts[y] * CELL * (1 - p) : 0;
    if (scale <= 0) continue;
    for (let x = 0; x < COLS; x++)
      if (grid[y][x]) drawCell(x, y, dim(grid[y][x]), offset, false, scale);
  }

  if (piece) {
    // Плавность: между шагами сдвигаем фигуру вниз на долю клетки,
    // пропорционально накопленному времени. У самой земли не сдвигаем,
    // иначе блок визуально влезал бы в стакан.
    const offset = collides(piece, 0, 1)
      ? 0
      : Math.min(1, dropAcc / dropInterval()) * CELL;

    drawPiece(piece, piece.y, offset, 1, 1);
  }

  // Перелёт вниз: наверху фигура тает и ужимается, внизу проявляется и растёт.
  if (anim && anim.phase === 'teleport') {
    const q = Math.min(1, anim.t / TELEPORT_MS);
    drawPiece(anim.piece, anim.fromY, 0, 1 - q, 1 - q * 0.4);
    drawPiece(anim.piece, anim.toY,   0, q,     0.6 + q * 0.4);
  }
}

// Рисует фигуру целиком: y задаётся отдельно от piece.y, чтобы одну и ту же
// фигуру можно было показать сразу в двух местах во время перелёта.
function drawPiece(pc, atY, offset, alpha, scale) {
  ctx.globalAlpha = alpha;
  for (let y = 0; y < pc.cells.length; y++)
    for (let x = 0; x < pc.cells[y].length; x++)
      if (pc.cells[y][x]) drawCell(pc.x + x, atY + y, pc.color, offset, true, scale);
  ctx.globalAlpha = 1;
}

// Затемняем цвет застывшего блока. Кэш — цветов всего восемь,
// а функция зовётся для каждой клетки в каждом кадре.
const dimCache = {};
function dim(hex) {
  if (!dimCache[hex]) {
    const n = parseInt(hex.slice(1), 16);
    const k = LOCK_DIM;
    dimCache[hex] = `rgb(${Math.round(((n >> 16) & 255) * k)},` +
                    `${Math.round(((n >> 8) & 255) * k)},` +
                    `${Math.round((n & 255) * k)})`;
  }
  return dimCache[hex];
}

function drawCell(x, y, color, offset = 0, active = false, scale = 1) {
  if (y < 0) return;
  // при scale < 1 блок ужимается к центру своей клетки
  const size = (CELL - 4) * scale;
  const inset = (CELL - size) / 2;
  const px = x * CELL + inset, py = y * CELL + offset + inset;
  ctx.fillStyle = color;
  ctx.fillRect(px, py, size, size);
  // блик сверху: у активной фигуры заметный, у застывшей — еле-еле
  ctx.fillStyle = active ? 'rgba(255,255,255,.28)' : 'rgba(255,255,255,.07)';
  ctx.fillRect(px, py, size, 6 * scale);
  // светлая рамка только у активной — она читается как «эта под управлением»
  if (active) {
    ctx.strokeStyle = 'rgba(255,255,255,.55)';
    ctx.lineWidth = 2;
    ctx.strokeRect(px + 1, py + 1, size - 2, size - 2);
  }
}

// Текущая пауза между шагами вниз. Уровень считается прямо из счёта,
// поэтому очистка сразу нескольких строк учитывается за один раз.
function dropInterval() {
  const level = Math.floor(score / SPEED_STEP);
  return Math.max(MIN_DROP_MS, DROP_MS / Math.pow(SPEED_MULT, level));
}

function loop(ts) {
  rafId = requestAnimationFrame(loop);
  if (gameOver) return;
  if (lastTs == null) lastTs = ts;
  const dt = ts - lastTs;
  lastTs = ts;

  if (anim) {
    anim.t += dt;
    stepAnim();
    draw();
    return;   // пока строки убираются, фигуры не двигаются
  }

  const interval = dropInterval();
  dropAcc += dt * (softDrop ? FAST_FACTOR : 1);
  while (dropAcc >= interval) {
    dropAcc -= interval;
    step();
    if (gameOver) break;
  }
  draw();
}

// Перелёт вниз, затем сжатие → съезд → продолжаем игру.
function stepAnim() {
  if (anim.phase === 'teleport') {
    if (anim.t < TELEPORT_MS) return;
    piece = anim.piece;   // фигура уже на месте назначения
    anim = null;
    lock();
    return;
  }
  if (anim.phase === 'shrink') {
    if (anim.t < SHRINK_MS) return;
    anim = { phase: 'fall', t: 0, shifts: applyClear(anim.rows) };
    return;
  }
  if (anim.t < FALL_MS) return;
  anim = null;
  if (checkTopOut()) { endGame(); return; }
  spawn();
}

function endGame() {
  gameOver = true;
  piece = null;
  draw();
  finalScoreEl.textContent = score;
  // Рекорд к этому моменту уже обновлён, поэтому равенство означает,
  // что он поставлен именно в этой партии.
  const isRecord = score > 0 && score === best;
  finalBestEl.textContent = isRecord ? `Новый рекорд: ${best}` : `Рекорд ${best}`;
  finalBestEl.classList.toggle('record', isRecord);
  overlayEl.classList.add('show');
  stageEl.classList.add('over');
}

function start() {
  grid = emptyGrid();
  score = 0;
  gameOver = false;
  softDrop = false;
  anim = null;
  dropAcc = 0;
  lastTs = null;
  scoreEl.textContent = '0';
  bestEl.textContent = best;
  overlayEl.classList.remove('show');
  stageEl.classList.remove('over');
  spawn();
  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}

// Управление не зависит от раскладки: сначала смотрим на физическую
// клавишу (e.code), затем на символ — латинский или кириллический.
const ACTION_BY_CODE = {
  KeyA: 'left', KeyD: 'right', KeyS: 'down', KeyW: 'rotate', KeyX: 'slam',
  // стрелки: вверх — поворот, вниз — телепорт до упора
  ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'rotate', ArrowDown: 'slam',
};
const ACTION_BY_CHAR = {
  a: 'left',   d: 'right',  s: 'down',   w: 'rotate',  x: 'slam',
  'ф': 'left', 'в': 'right', 'ы': 'down', 'ц': 'rotate', 'ч': 'slam',
};

function actionOf(e) {
  return ACTION_BY_CODE[e.code] || ACTION_BY_CHAR[e.key.toLowerCase()] || null;
}

// Чем различаем зажатые клавиши: телепорт висит на трёх разных, и каждая
// должна отпускаться сама по себе.
function keyId(e) {
  return e.code || e.key.toLowerCase();
}

document.addEventListener('keydown', e => {
  const action = actionOf(e);
  if (!action) return;
  e.preventDefault();
  if (gameOver) return;
  if (action === 'left') move(-1);
  else if (action === 'right') move(1);
  else if (action === 'rotate') rotate();
  // e.repeat — автоповтор от зажатой клавиши. Его игнорируем, иначе он сам
  // снова включил бы ускорение сразу после сброса в spawn().
  else if (action === 'down' && !e.repeat) softDrop = true;
  // Телепорт срабатывает строго на нажатие: пока клавишу не отпустили,
  // повторных срабатываний нет — иначе зажатая клавиша роняла бы фигуру
  // за фигурой.
  else if (action === 'slam' && !slamKeys.has(keyId(e))) {
    slamKeys.add(keyId(e));
    hardDrop();
  }
});

document.addEventListener('keyup', e => {
  const action = actionOf(e);
  if (action === 'down') softDrop = false;
  else if (action === 'slam') slamKeys.delete(keyId(e));   // клавишу можно нажать снова
});

document.getElementById('restart').addEventListener('click', start);

start();
</script>
</body>
</html>
